[project]
name = "cryozeta"
version = "0.1.0"
description = "CryoZeta is a de novo macromolecular structure modeling tool that integrates cryo-EM density information with a diffusion-model-based structure prediction pipeline."
readme = "README.md"
authors = [
    { name = "Zicong Zhang", email = "zhan1797@purdue.edu" },
    { name = "Shu Li", email = "li3916@purdue.edu" },
    { name = "Boyuan Liu", email = "liu3852@purdue.edu" },
    { name = "Han Zhu", email = "zhu773@purdue.edu" }
]
classifiers = [
    "Operating System :: POSIX :: Linux"
]
requires-python = ">=3.12,<3.13"
dependencies = ["pytest>=9.0.2,<10"]

[project.scripts]
cryozeta-detection = "cryozeta.runner.inference_detection:app"
cryozeta-inference = "cryozeta.runner.inference:cli"
cryozeta-combine = "cryozeta.runner.combine:app"
cryozeta-cycle-predict = "cryozeta.runner.cycle_predict:main"
cryozeta-combine-stages = "cryozeta.runner.combine_stages:main"

[tool.pixi.workspace]
channels = ["nvidia", "pytorch", "conda-forge"]
platforms = ["linux-64"]
channel-priority = "disabled"
license-file = "LICENSE"
readme = "README.md"
homepage = "https://em.kiharalab.org/algorithm/CryoZeta"
repository = "https://github.com/kiharalab/CryoZeta"

[tool.pixi.activation]
scripts = ["env_setup.sh"]

[tool.pixi.tasks]
download-assets = "python -c \"from huggingface_hub import snapshot_download; snapshot_download('KiharaLab/CryoZeta', repo_type='model', local_dir='assets')\""
clone-teaser = "test -d externals/TEASER-plusplus || (mkdir -p externals && git clone --depth 1 https://github.com/MIT-SPARK/TEASER-plusplus.git externals/TEASER-plusplus)"
build-teaser = { cmd = "test -f externals/TEASER-plusplus/build/libteaser.so || (cmake -S externals/TEASER-plusplus -B externals/TEASER-plusplus/build -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_BINDINGS=ON -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF && cmake --build externals/TEASER-plusplus/build -j$(nproc))", depends-on = ["clone-teaser"] }
setup = { cmd = "sh -c 'echo \"==> Detected PIXI_ENV: $PIXI_ENV\" && if [ \"$PIXI_ENV\" != \"default\" ]; then echo \"==> Installing environment: $PIXI_ENV\" && pixi install -e \"$PIXI_ENV\"; fi && echo \"==> Setup complete!\"'", depends-on = ["download-assets", "build-teaser"] }


[tool.pixi.system-requirements]
linux = "4.18"
libc = { family = "glibc", version = "2.31" }

[tool.pixi.dependencies]
numpy = "<2.0.0"
boost = ">=1.82"
libboost-devel = ">=1.82"
eigen = "3.4.*"
cutlass = "*"
pybind11 = ">=2.12"

[tool.pixi.feature.cu11.dependencies]
cuda-version = "11.8.*"
cudatoolkit = "11.8.*"
gxx = ">=11,<12"
gcc = ">=11,<12"
cuda-nvcc = { version = "11.8.*", channel = "nvidia" }
cuda-cudart-dev = { version = "11.8.*", channel = "nvidia" }
libcusparse-dev = { version = "11.7.5.86.*", channel = "nvidia" }
libcublas-dev = { version = "11.11.3.6.*", channel = "nvidia" }
libcusolver-dev = { version = "11.4.1.48.*", channel = "nvidia" }

[tool.pixi.feature.cu11.pypi-dependencies]
torch = { url = "https://download-r2.pytorch.org/whl/cu118/torch-2.7.1%2Bcu118-cp312-cp312-manylinux_2_28_x86_64.whl" }
torchvision = { url = "https://download-r2.pytorch.org/whl/cu118/torchvision-0.22.1%2Bcu118-cp312-cp312-manylinux_2_28_x86_64.whl" }

[tool.pixi.feature.cu11.system-requirements]
cuda = "11.0"

[tool.pixi.feature.cu12.dependencies]
cuda-version = { version = "12.8.*", channel = "nvidia" }
cuda = { version = "12.8.*", channel = "nvidia" }
cuda-nvrtc = ">=12.8.93,<13"
gxx = ">=13,<13.3"
gcc = ">=13,<13.3"

[tool.pixi.feature.cu12.pypi-dependencies]
torch = { url = "https://download-r2.pytorch.org/whl/cu128/torch-2.11.0%2Bcu128-cp312-cp312-manylinux_2_28_x86_64.whl" }
torchvision = { url = "https://download-r2.pytorch.org/whl/cu128/torchvision-0.26.0%2Bcu128-cp312-cp312-manylinux_2_28_x86_64.whl" }
cuequivariance-ops-torch-cu12 = ">=0.8.0"

[tool.pixi.feature.cu12.system-requirements]
cuda = "12.0"

[tool.pixi.feature.cu13.dependencies]
cuda-version = { version = "13.2.*", channel = "nvidia" }
cuda = { version = "13.2.*", channel = "nvidia" }
cuda-nvrtc = "13.2.*"
cuda-nvcc = { version = "13.2.*", channel = "nvidia" }
gxx = ">=15,<16"
gcc = ">=15,<16"

[tool.pixi.feature.cu13.pypi-dependencies]
torch = { url = "https://download-r2.pytorch.org/whl/cu132/torch-2.15.0%2Bcu132-cp312-cp312-manylinux_2_28_x86_64.whl" }
torchvision = { url = "https://download-r2.pytorch.org/whl/cu132/torchvision-0.29.1%2Bcu132-cp312-cp312-manylinux_2_28_x86_64.whl" }
cuequivariance-ops-torch-cu13 = ">=0.8.0"

[tool.pixi.feature.cu13.system-requirements]
cuda = "13.0"

[tool.pixi.pypi-dependencies]
cryozeta = { path = ".", editable = true }
biopython = ">=1.85"
biotite = "==1.0.1"
deepspeed = ">=0.16.7"
dm-tree = ">=0.1.9"
einops = ">=0.8.1"
gemmi = ">=0.7.5"
huggingface-hub = ">=0.33.0"
icecream = ">=2.1.4"
ipdb = ">=0.13.13"
jaxtyping = ">=0.3.2"
jupyter = ">=1.1.1"
loguru = ">=0.7.3"
matplotlib = ">=3.10.3"
ml-collections = ">=1.1.0"
modelcif = ">=1.3"
mrcfile = ">=1.5.4"
numba = ">=0.61.2"
pandas = ">=2.2.3"
pdbeccdutils = ">=0.8.5"
protobuf = ">=6.30.2"
py3dmol = ">=2.4.2"
ray = { version = ">=2.49.2", extras = ["default"] }
rdkit = ">=2025.3.2"
safetensors = ">=0.8.0"
scikit-image = ">=0.25.2"
scikit-learn = ">=1.6.1"
scipy = ">=1.15.3"
tos = ">=2.8.3"
tqdm = ">=4.70.1"
typer = ">=0.16.0"
wandb = ">=0.19.11"
shot-fpfh = { git = "https://github.com/aubin-tchoi/shot-fpfh" }
open3d = ">=0.19.0"
small-gicp = "<2.0"
vesper = { git = "https://github.com/kiharalab/VESPER_CUDA.git", branch = "main" }
tilelang = ">=0.0.1"
cuequivariance-torch = ">=0.8.0"

[tool.pixi.feature.dev.pypi-dependencies]
prek = ">=0.3.2"
ruff = ">=0.12.0"

[tool.pixi.environments]
default = { features = ["cu12"], solve-group = "default" }
cu11 = { features = ["cu11"], solve-group = "cu11" }
cu13 = { features = ["cu13"], solve-group = "cu13" }
dev = { features = ["dev", "cu12"], solve-group = "default" }
dev-cu11 = { features = ["dev", "cu11"], solve-group = "cu11" }
dev-cu13 = { features = ["dev", "cu13"], solve-group = "cu13" }
